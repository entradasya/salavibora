<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EntradasYa CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, writeBatch, getDocs, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
window.__fb = { initializeApp, getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, writeBatch, getDocs, getDoc, serverTimestamp };
window.dispatchEvent(new Event("fb-ready"));
</script>
<style>
  :root{
    --bg:#0f1720; --panel:#16202b; --panel2:#1c2733; --line:#26333f;
    --ink:#e7edf3; --ink-dim:#8fa1b0; --accent:#3ecf8e; --accent-dim:#255c46;
    --warn:#e0a53e; --danger:#e0603e; --info:#4d8ff0;
  }
  body{background:var(--bg); color:var(--ink); font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#2c3a48;border-radius:4px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px;}
  .panel2{background:var(--panel2); border:1px solid var(--line); border-radius:8px;}
  .btn{padding:.55rem 1rem; border-radius:8px; font-weight:600; font-size:.875rem; transition:.15s; cursor:pointer;}
  .btn-accent{background:var(--accent); color:#08130d;} .btn-accent:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);} .btn-ghost:hover{border-color:#3a4a5a;}
  .btn-danger{background:var(--danger); color:#1a0704;} .btn-danger:hover{filter:brightness(1.1);}
  input,select,textarea{background:#0f1720; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:.5rem .65rem; font-size:.875rem; width:100%;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  label{font-size:.72rem; color:var(--ink-dim); font-weight:600; letter-spacing:.02em;}
  .navitem{display:flex; align-items:center; gap:.6rem; padding:.6rem .8rem; border-radius:8px; color:var(--ink-dim); cursor:pointer; font-size:.875rem; font-weight:500;}
  .navitem:hover{background:var(--panel2); color:var(--ink);}
  .navitem.active{background:var(--accent-dim); color:var(--accent);}
  .badge{padding:.15rem .55rem; border-radius:999px; font-size:.7rem; font-weight:700; letter-spacing:.02em; white-space:nowrap;}
  table{width:100%; border-collapse:collapse; font-size:.83rem;}
  th{text-align:left; color:var(--ink-dim); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; padding:.5rem .7rem; border-bottom:1px solid var(--line);}
  td{padding:.55rem .7rem; border-bottom:1px solid var(--line);}
  tr.row:hover{background:var(--panel2); cursor:pointer;}
  .modal-bg{position:fixed; inset:0; background:rgba(6,10,14,.7); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:2rem 1rem; overflow-y:auto;}
  .tab{padding:.5rem .9rem; border-radius:7px; font-size:.8rem; font-weight:600; color:var(--ink-dim); cursor:pointer;}
  .tab.active{background:var(--panel2); color:var(--accent);}
  input[type=checkbox]{width:20px; height:20px; cursor:pointer; accent-color:var(--accent); vertical-align:middle;}
  th input[type=checkbox], td input[type=checkbox]{width:20px; height:20px;}
  .stat-num{font-size:1.7rem; font-weight:800; line-height:1;}
  .kicker{font-size:.68rem; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>

<script>
/* ===================== ESTADO GLOBAL ===================== */
const S = {
  fbApp:null, db:null, fb:null,
  config: JSON.parse(localStorage.getItem('ey_fb_config')||'null'),
  session: JSON.parse(localStorage.getItem('ey_session')||'null'),
  comerciales:[], clientes:[], eventos:[], contactos:[], comisiones:[], logs:[],
  listenersOn:false,
  ui:{ view:'dashboard', clienteFiltro:{q:'',comercial:'',estado:'',tipo:'',prioridad:'',investigacion:''}, clienteDetalleId:null, clienteDetalleTab:'investigacion', importStep:0, importRows:[], importDupes:[], showPasswordForm:false, clientesPage:0, clientesPageSize:100 }
};
const PCT_ADMIN = 0.075; // tu comisión como comercial/administrador, sobre los clientes sin asignar
const PCT_COMERCIAL_DEFECTO = 0.04; // comisión por defecto de cada comercial, editable por persona
function tasaComision(c){
  if(!c || !c.comercialId) return PCT_ADMIN;
  const cm = S.comerciales.find(x=>x.id===c.comercialId);
  const pct = cm && cm.pctComision!=null ? Number(cm.pctComision) : (PCT_COMERCIAL_DEFECTO*100);
  return pct/100;
}
const money = n => (isFinite(n)?n:0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const numf = n => (isFinite(n)?n:0).toLocaleString('es-ES');
const fdate = d => { if(!d) return '-'; const dt = (d instanceof Date)? d : new Date(d); if(isNaN(dt)) return '-'; return dt.toLocaleDateString('es-ES'); };
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);

const ESTADOS = ["Nuevo","1º toma de contacto","Interesado","Seguimiento","Negociación","Primer evento","Cliente activo","Cliente recurrente","Perdido"];
const TIPOS = ["Sala","Discoteca","Promotor","Productora","Festival","Asociación","Teatro","Palacio de congresos/Auditorios","Artista / manager","Otro"];
const TIPOS_CONTACTO = ["Llamada","WhatsApp","Email","Instagram","Reunión","Videollamada","Otro"];
const PRIORIDADES = ["BAJO","MEDIO","ALTO","ESTRATÉGICO"];
const RESULTADOS = ["No contesta","1º toma de contacto","Interesado","Quiere información","Quiere reunión","Quiere probar EntradasYa.es","Negociación","Cliente conseguido","No interesado"];

// Calcula ventas y retorno REALES a partir de los eventos/comisiones que se han
// introducido para ese cliente (ya no es una estimación, son datos reales una vez registrados).
function calcPotencial(c){
  const ks = S.comisiones.filter(k=>k.clienteId===c.id);
  const entradasAnuales = ks.reduce((a,k)=>a+(Number(k.entradas)||0),0);
  const ventasAnuales = ks.reduce((a,k)=>a+(Number(k.valorTotal)||0),0);
  const retornoAnual = ventasAnuales*tasaComision(c);
  const retornoMensual = retornoAnual/12;
  return {entradasAnuales, ventasAnuales, retornoAnual, retornoMensual};
}
function prioridadDe(retornoAnual){
  if(retornoAnual>10000) return 'ESTRATÉGICO';
  if(retornoAnual>=5000) return 'ALTO';
  if(retornoAnual>=2000) return 'MEDIO';
  return 'BAJO';
}
function prioridadColor(p){
  return {BAJO:'background:#2a2f22;color:#a9c15a', MEDIO:'background:#2a2c1e;color:#e0c23e', ALTO:'background:#2c2418;color:#e0a53e', 'ESTRATÉGICO':'background:#26332c;color:#3ecf8e'}[p]||'';
}
function estadoColor(e){
  const map = {Nuevo:'#4d8ff0', '1º toma de contacto':'#4d8ff0', Interesado:'#e0c23e', Seguimiento:'#e0a53e', Negociación:'#e0a53e', 'Primer evento':'#3ecf8e', 'Cliente activo':'#3ecf8e', 'Cliente recurrente':'#3ecf8e', Perdido:'#e0603e'};
  return map[e]||'#8fa1b0';
}

/* ===================== FIREBASE ===================== */
function connectFirebase(cfg){
  S.fb = window.__fb;
  S.fbApp = S.fb.initializeApp(cfg);
  S.db = S.fb.getFirestore(S.fbApp);
  S.config = cfg;
  localStorage.setItem('ey_fb_config', JSON.stringify(cfg));
}
function col(name){ return S.fb.collection(S.db, name); }

function startListeners(){
  if(S.listenersOn) return;
  S.listenersOn = true;
  S.fb.onSnapshot(col('crm2_comerciales'), snap=>{
    S.comerciales = snap.docs.map(d=>({id:d.id,...d.data()}));
    if(!isAdmin() && S.session && S.session.comercialId){
      const propio = S.comerciales.find(cm=>cm.id===S.session.comercialId);
      if(!propio || propio.estado!=='activo'){
        alert('Tu acceso ha sido desactivado por el administrador.');
        doLogout(); return;
      }
    }
    render();
  });
  S.fb.onSnapshot(col('crm2_clientes'), snap=>{ S.clientes = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  // (crm2_eventos ya no se usa: los eventos/comisiones reales viven en crm2_comisiones)
  S.fb.onSnapshot(col('crm2_contactos'), snap=>{ S.contactos = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_comisiones'), snap=>{ S.comisiones = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_log'), snap=>{
    S.logs = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.fechaHora||'').localeCompare(a.fechaHora||''));
    if(isOwner() && S._logsCargados){
      snap.docChanges().forEach(ch=>{
        if(ch.type==='added'){
          const l = ch.doc.data();
          if(ACCIONES_CONTACTO.has(l.accion) && l.email!==S.session.email){
            notificarEscritorio(l.accion, `${l.usuario}: ${l.detalle||''}`);
          }
        }
      });
    }
    S._logsCargados = true;
    render();
  });
  if(isOwner() && typeof Notification!=='undefined' && Notification.permission==='default'){
    Notification.requestPermission();
  }
}
function notificarEscritorio(titulo, cuerpo){
  try{
    if(typeof Notification!=='undefined' && Notification.permission==='granted'){
      new Notification('CRM EntradasYa — '+titulo, {body:cuerpo});
    }
  }catch(e){}
}
const ACCIONES_CONTACTO = new Set([
  'Cliente creado','Cliente editado','Cliente eliminado','Eliminación múltiple de clientes','Reasignación de cliente',
  'Ficha importada (actualiza todos los datos del cliente)','Ficha importada (cliente nuevo)',
  'Ficha importada desde la ficha del cliente (datos de contacto + investigación)',
  'Investigación comercial guardada','Aviso de comercial','Registro de historial eliminado','Registro de venta eliminado',
  'Acceso revocado','Acceso reactivado'
]);

/* ===================== NOTIFICACIONES (solo admin) ===================== */
function clientesSinEventos(){
  const estadosVigilar = ['Cliente activo','Cliente recurrente','Primer evento'];
  const hoy = new Date();
  return S.clientes.filter(c=>estadosVigilar.includes(c.estado)).map(c=>{
    const ventas = S.comisiones.filter(k=>k.clienteId===c.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
    const ref = ventas[0]?.fecha || c.fechaAlta;
    if(!ref) return null;
    const dias = Math.floor((hoy - new Date(ref)) / 86400000);
    return dias>60 ? {c, dias, ref} : null;
  }).filter(Boolean).sort((a,b)=>b.dias-a.dias);
}
function comercialesInactivos(){
  const hoy = new Date();
  return S.comerciales.map(cm=>{
    const suyos = S.logs.filter(l=>l.email===cm.email);
    const ultimo = suyos[0]; // S.logs ya viene ordenado desc por fecha
    const dias = ultimo ? Math.floor((hoy - new Date(ultimo.fechaHora)) / 86400000) : null;
    return (dias===null || dias>7) ? {cm, dias} : null;
  }).filter(Boolean).sort((a,b)=>(b.dias??9999)-(a.dias??9999));
}
function contarNotificaciones(){
  return clientesSinEventos().length + comercialesInactivos().length;
}
function viewNotificaciones(){
  const sinEventos = clientesSinEventos();
  const inactivos = comercialesInactivos();
  return `
  <h2 class="text-xl font-bold mb-1">🔔 Notificaciones</h2>
  <p class="text-sm mb-5" style="color:var(--ink-dim)">Avisos automáticos calculados en vivo con los datos actuales.</p>

  <div class="panel p-4 mb-5">
    <div class="font-bold mb-3">⏰ Clientes activos sin eventos hace más de 2 meses (${sinEventos.length})</div>
    ${sinEventos.length? `<div class="overflow-x-auto"><table>
      <thead><tr><th>Cliente</th><th>Estado</th><th>Comercial</th><th>Última referencia</th><th>Días sin evento</th></tr></thead>
      <tbody>${sinEventos.map(x=>`<tr class="row" onclick="openCliente('${x.c.id}')">
        <td class="font-semibold">${esc(x.c.nombreEmpresa)}</td>
        <td>${esc(x.c.estado)}</td>
        <td style="color:var(--ink-dim)">${esc(nombreComercial(x.c.comercialId))}</td>
        <td>${fdate(x.ref)}</td>
        <td style="color:var(--danger);font-weight:700">${x.dias} días</td>
      </tr>`).join('')}</tbody>
    </table></div>` : `<p class="text-sm" style="color:var(--ink-dim)">Ninguno, todo al día.</p>`}
  </div>

  <div class="panel p-4">
    <div class="font-bold mb-3">👤 Comerciales sin actividad hace más de 1 semana (${inactivos.length})</div>
    ${inactivos.length? `<div class="overflow-x-auto"><table>
      <thead><tr><th>Comercial</th><th>Email</th><th>Última actividad</th></tr></thead>
      <tbody>${inactivos.map(x=>`<tr>
        <td class="font-semibold">${esc(x.cm.nombre)}</td>
        <td style="color:var(--ink-dim)">${esc(x.cm.email)}</td>
        <td style="color:var(--danger);font-weight:700">${x.dias==null?'Nunca ha tenido actividad':x.dias+' días'}</td>
      </tr>`).join('')}</tbody>
    </table></div>` : `<p class="text-sm" style="color:var(--ink-dim)">Todos activos esta semana.</p>`}
  </div>`;
}

/* ===================== LOG DE ACTIVIDAD ===================== */
async function logAction(accion, detalle){
  try{
    await S.fb.addDoc(col('crm2_log'), {
      accion, detalle: detalle||'',
      usuario: (S.session&&(S.session.nombre||S.session.email))||'desconocido',
      email: (S.session&&S.session.email)||'',
      role: (S.session&&S.session.role)||'',
      fechaHora: new Date().toISOString()
    });
  }catch(e){ /* si falla el log, no bloqueamos la acción principal */ }
}

async function ensureAdminBootstrap(){
  const snap = await S.fb.getDocs(col('crm2_users'));
  return snap.size===0;
}

/* ===================== RENDER RAÍZ ===================== */
function render(){
  const root = document.getElementById('app');
  if(!S.config){ root.innerHTML = viewSetup(); return; }
  if(!S.db){ connectFirebase(S.config); }
  if(!S.session){ root.innerHTML = viewCheckingOrLogin(); if(!S._checked){ checkBootstrap(); } return; }
  startListeners();
  root.innerHTML = viewApp();
}
let bootstrapNeeded = null;
async function checkBootstrap(){
  S._checked = true;
  bootstrapNeeded = await ensureAdminBootstrap();
  render2();
}
function render2(){ document.getElementById('app').innerHTML = viewCheckingOrLogin(); }

/* ===================== VISTA: SETUP FIREBASE ===================== */
function viewSetup(){
  return `
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="panel p-8 w-full max-w-lg">
      <h1 class="text-xl font-bold mb-1">EntradasYa CRM</h1>
      <p class="text-sm mb-5" style="color:var(--ink-dim)">Conecta tu base de datos gratuita (Firebase Firestore). Crea un proyecto gratis en console.firebase.google.com, activa Firestore, copia el objeto de configuración web y pégalo aquí.</p>
      <label>Configuración Firebase (objeto JSON)</label>
      <textarea id="cfgInput" rows="8" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea>
      <div id="cfgErr" class="text-sm mt-2" style="color:var(--danger)"></div>
      <button class="btn btn-accent w-full mt-4" onclick="submitConfig()">Guardar y conectar</button>
    </div>
  </div>`;
}
window.submitConfig = function(){
  const txt = document.getElementById('cfgInput').value.trim();
  try{
    const cfg = JSON.parse(txt);
    if(!cfg.projectId || !cfg.apiKey) throw new Error('faltan campos');
    connectFirebase(cfg);
    render();
  }catch(e){ document.getElementById('cfgErr').textContent = 'JSON no válido. Revisa que hayas copiado el objeto completo.'; }
}

/* ===================== VISTA: LOGIN / BOOTSTRAP ===================== */
function viewCheckingOrLogin(){
  if(bootstrapNeeded===null){
    return `<div class="min-h-screen flex items-center justify-center"><p style="color:var(--ink-dim)">Conectando...</p></div>`;
  }
  if(bootstrapNeeded){
    return `
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="panel p-8 w-full max-w-md">
        <h1 class="text-xl font-bold mb-1">Crear administrador</h1>
        <p class="text-sm mb-5" style="color:var(--ink-dim)">No hay usuarios todavía. Crea la cuenta de administrador principal.</p>
        <div class="space-y-3">
          <div><label>Nombre</label><input id="bNombre"></div>
          <div><label>Email</label><input id="bEmail" type="email"></div>
          <div><label>Contraseña</label><input id="bPass" type="password"></div>
        </div>
        <div id="bErr" class="text-sm mt-2" style="color:var(--danger)"></div>
        <button class="btn btn-accent w-full mt-4" onclick="createAdmin()">Crear administrador</button>
      </div>
    </div>`;
  }
  return `
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="panel p-8 w-full max-w-md">
      <h1 class="text-xl font-bold mb-1">EntradasYa CRM</h1>
      <p class="text-sm mb-5" style="color:var(--ink-dim)">Inicia sesión para continuar.</p>
      <div class="space-y-3">
        <div><label>Email</label><input id="lEmail" type="email"></div>
        <div><label>Contraseña</label><input id="lPass" type="password"></div>
      </div>
      <div id="lErr" class="text-sm mt-2" style="color:var(--danger)"></div>
      <button class="btn btn-accent w-full mt-4" onclick="doLogin()">Entrar</button>
    </div>
  </div>`;
}
window.createAdmin = async function(){
  const nombre = document.getElementById('bNombre').value.trim();
  const email = document.getElementById('bEmail').value.trim().toLowerCase();
  const pass = document.getElementById('bPass').value;
  if(!nombre||!email||!pass){ document.getElementById('bErr').textContent='Rellena todos los campos.'; return; }
  const newId = uid();
  await S.fb.setDoc(S.fb.doc(col('crm2_users'), newId), {nombre, email, pass, role:'admin', comercialId:null, creado:todayISO()});
  bootstrapNeeded = false;
  S.session = {userId:newId, email, nombre, role:'admin', comercialId:null};
  localStorage.setItem('ey_session', JSON.stringify(S.session));
  render();
}
window.doLogin = async function(){
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const pass = document.getElementById('lPass').value;
  const snap = await S.fb.getDocs(S.fb.query(col('crm2_users'), S.fb.where('email','==',email)));
  const u = snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>x.pass===pass);
  if(!u){ document.getElementById('lErr').textContent='Email o contraseña incorrectos.'; return; }
  if(u.role==='comercial' && u.comercialId){
    const cmSnap = await S.fb.getDoc(S.fb.doc(col('crm2_comerciales'), u.comercialId));
    const cmData = cmSnap.exists() ? cmSnap.data() : null;
    if(!cmData || cmData.estado!=='activo'){
      document.getElementById('lErr').textContent = 'Tu acceso ha sido desactivado por el administrador.';
      return;
    }
  }
  S.session = {userId:u.id, email:u.email, nombre:u.nombre, role:u.role, comercialId:u.comercialId||null};
  localStorage.setItem('ey_session', JSON.stringify(S.session));
  render();
  logAction('Inicio de sesión','');
}
window.doLogout = function(){ S.session=null; localStorage.removeItem('ey_session'); render(); }

/* ===================== SHELL APP ===================== */
function isAdmin(){ return S.session && S.session.role==='admin'; }
const OWNER_EMAIL = 'danielgomezgarcia1980@gmail.com';
function isOwner(){ return S.session && S.session.email===OWNER_EMAIL; }
function misClientes(){
  if(isAdmin()) return S.clientes;
  // Solo los clientes que tiene asignados el admin + los que él mismo ha creado (vía ficha).
  // Ya NO incluye el "pool" de sin asignar: eso ahora es solo del administrador.
  return S.clientes.filter(c=>c.comercialId===S.session.comercialId || c.creadoPor===S.session.userId);
}
function puedeAbrir(c){
  if(!c) return false;
  if(isAdmin()) return true;
  return c.comercialId===S.session.comercialId || c.creadoPor===S.session.userId;
}
function puedeEditar(c){
  // Editar la FICHA del contacto (nombre/teléfono/email/...) es SOLO del administrador.
  // Los comerciales solo pueden crear/actualizar contactos subiendo una ficha comercial (.txt).
  return isAdmin();
}
function viewApp(){
  const nav = [
    ['dashboard','Panel'],['clientes','Clientes'],['seguimientos','Seguimientos'],
    ...(isAdmin()?[['comisiones','Comisiones']]:[]),
    ['comerciales','Comerciales'],
    ...(isAdmin()?[['importar','Importar / Exportar']]:[]),
    ...(isOwner()?[['notificaciones','🔔 Notificaciones'],['actividad','Actividad']]:[])
  ];
  return `
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 border-r p-4 flex flex-col" style="border-color:var(--line)">
      <div class="mb-6">
        <div class="font-extrabold text-lg">EntradasYa</div>
        <div class="kicker">CRM comercial</div>
      </div>
      <nav class="space-y-1 flex-1">
        ${nav.map(([k,l])=>`<div class="navitem ${S.ui.view===k?'active':''}" onclick="setView('${k}')">${l}${k==='notificaciones'&&contarNotificaciones()>0?` <span class="badge" style="background:var(--danger);color:#fff">${contarNotificaciones()}</span>`:''}</div>`).join('')}
      </nav>
      <div class="pt-4 border-t" style="border-color:var(--line)">
        <div class="text-sm font-semibold">${S.session.nombre||S.session.email}</div>
        <div class="text-xs mb-3" style="color:var(--ink-dim)">${isAdmin()?'Administrador':'Comercial'}</div>
        <button class="btn btn-ghost w-full text-xs mb-2" onclick="openPasswordForm()">Cambiar contraseña</button>

      </div>
      <div id="pfErr" class="text-sm mt-2" style="color:var(--danger)"></div>

window.savePassword = async function(){
  const actual = document.getElementById('pf_actual').value;
  const nueva = document.getElementById('pf_nueva').value;
  const repetir = document.getElementById('pf_repetir').value;
  const err = document.getElementById('pfErr');
  if(!actual||!nueva||!repetir){ err.textContent='Rellena todos los campos.'; return; }
  if(nueva!==repetir){ err.textContent='Las contraseñas nuevas no coinciden.'; return; }
  if(nueva.length<4){ err.textContent='La nueva contraseña es demasiado corta.'; return; }
  const ref = S.fb.doc(col('crm2_users'), S.session.userId);
  const snap = await S.fb.getDoc(ref);
  if(!snap.exists() || snap.data().pass!==actual){ err.textContent='La contraseña actual no es correcta.'; return; }
  await S.fb.updateDoc(ref, {pass:nueva});
  logAction('Cambio de contraseña','');
  S.ui.showPasswordForm=false; render();
  alert('Contraseña actualizada correctamente.');
}

function viewRendimientoComerciales(){
  const ESTADOS_RANKING = ['1º toma de contacto','Interesado','Negociación','Primer evento','Cliente activo','Cliente recurrente'];
  const rows = S.comerciales.map(cm=>{
    const propios = S.clientes.filter(c=>c.comercialId===cm.id);
    const conseguidos = propios.filter(c=>['Cliente activo','Cliente recurrente','Primer evento'].includes(c.estado)).length;
    const ventasComisiones = S.comisiones.filter(k=>propios.some(p=>p.id===k.clienteId));
    const ventas = ventasComisiones.reduce((a,k)=>a+Number(k.valorTotal||0),0);
    const nEventos = ventasComisiones.length;
    const pct = cm.pctComision!=null ? Number(cm.pctComision) : PCT_COMERCIAL_DEFECTO*100;
    const comision = ventas*(pct/100);
    const porEstado = {};
    ESTADOS_RANKING.forEach(e=> porEstado[e] = propios.filter(c=>c.estado===e).length);
    return {cm, propios:propios.length, conseguidos, ventas, comision, pct, nEventos, porEstado};
  });
  const ranking = [...rows].sort((a,b)=>b.ventas-a.ventas);

  return `
  <div class="panel p-4 mt-4">
    <div class="font-bold mb-3">Ranking de comerciales</div>
    <div class="overflow-x-auto">
    <table>
      <thead><tr><th>#</th><th>Comercial</th>${ESTADOS_RANKING.map(e=>`<th>${e}</th>`).join('')}<th>Clientes conseguidos</th><th>Eventos con ventas</th><th>Ventas generadas</th><th>Comisión</th></tr></thead>
      <tbody>
      ${ranking.length? ranking.map((r,i)=>`<tr${i===0?' style="background:var(--panel-2,rgba(62,207,142,.08))"':''}>
          <td class="font-bold">${i+1}º</td>
          <td class="font-semibold">${esc(r.cm.nombre)}</td>
          ${ESTADOS_RANKING.map(e=>`<td style="text-align:center">${r.porEstado[e]}</td>`).join('')}
          <td>${r.conseguidos}</td>
          <td style="text-align:center">${r.nEventos}</td>
          <td class="font-semibold">${money(r.ventas)}</td>
          <td>${money(r.comision)} <span class="text-xs" style="color:var(--ink-dim)">(${r.pct}%)</span></td>
        </tr>`).join('') : `<tr><td colspan="${5+ESTADOS_RANKING.length}" style="color:var(--ink-dim)">Sin comerciales todavía.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---- Importar ficha comercial (.txt con formato ETIQUETA: valor) ---- */
function parsearFichaTxt(texto){
  const campos = {};
  texto.split(/\r?\n/).forEach(linea=>{
    const m = linea.match(/^\s*([A-Za-zÁÉÍÓÚÑáéíóúñ_]+)\s*:\s*(.*)$/);
    if(!m) return;
    const clave = m[1].trim().toUpperCase();
    const valor = m[2].trim().replace(/\s*\|\s*/g, '\n');
    campos[clave] = valor;
  });
  return {
    nombreEmpresa: campos['EMPRESA']||'',
    personaContacto: campos['CONTACTO']||campos['RESPONSABLE']||'',
    tipoCliente: campos['TIPO']||'',
    naturaleza: campos['NATURALEZA']||'',
    tamano: campos['TAMANO']||campos['TAMAÑO']||'',
    telefono: campos['TELEFONO']||campos['TELÉFONO']||'',
    whatsapp: campos['WHATSAPP']||'',
    email: campos['EMAIL']||'',
    instagram: (campos['INSTAGRAM']||'').replace(/^@/,''),
    web: campos['WEB']||'',
    ciudad: campos['CIUDAD']||'',
    provincia: campos['PROVINCIA']||'',
    actividad: campos['ACTIVIDAD']||'',
    situacion: campos['SITUACION']||campos['SITUACIÓN']||'',
    oportunidad: campos['OPORTUNIDAD']||'',
    puntoEntrada: campos['PUNTO_ENTRADA']||'',
    observaciones: campos['OBSERVACIONES']||''
  };
}

// Botón global en Clientes: sube una ficha y crea/actualiza el cliente correspondiente (TODOS los datos)
window.importarFichaGlobal = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
   try{
    const d = parsearFichaTxt(e.target.result);
    if(!d.nombreEmpresa){ alert('El archivo no tiene una línea "EMPRESA: ...", no se puede identificar el cliente.'); return; }
    const existente = S.clientes.find(c => c.nombreEmpresa.trim().toLowerCase() === d.nombreEmpresa.trim().toLowerCase());
    if(existente && !isAdmin() && !puedeAbrir(existente)){
      alert(`"${existente.nombreEmpresa}" ya existe en el CRM pero no está asignado a ti ni lo creaste tú. No puedes modificarlo; avisa al administrador si crees que debería ser tuyo.`);
      event.target.value = ''; return;
    }
    const investigacion = { naturaleza:d.naturaleza, tamano:d.tamano, actividad:d.actividad, situacion:d.situacion, oportunidad:d.oportunidad, puntoEntrada:d.puntoEntrada, observaciones:d.observaciones, fecha:todayISO() };
    let idFinal, modo;
    if(existente){
      if(!confirm(`Ya existe "${existente.nombreEmpresa}" en el CRM. ¿Actualizar TODOS sus datos de contacto y su ficha de investigación con este archivo? (se sobrescribirá lo que ya hubiera)`)){ event.target.value=''; return; }
      const patch = { investigacion };
      // Se actualizan siempre todos los datos que traiga el archivo (si un campo viene vacío, se deja como estaba)
      if(d.personaContacto) patch.personaContacto = d.personaContacto;
      if(d.tipoCliente) patch.tipoCliente = d.tipoCliente;
      if(d.telefono) patch.telefono = d.telefono;
      if(d.whatsapp) patch.whatsapp = d.whatsapp;
      if(d.email) patch.email = d.email;
      if(d.instagram) patch.instagram = d.instagram;
      if(d.web) patch.web = d.web;
      if(d.ciudad) patch.ciudad = d.ciudad;
      if(d.provincia) patch.provincia = d.provincia;
      await S.fb.updateDoc(S.fb.doc(col('crm2_clientes'), existente.id), patch);
      logAction('Ficha importada (actualiza todos los datos del cliente)', existente.nombreEmpresa);
      idFinal = existente.id; modo = 'ACTUALIZADO (cliente ya existía)';
      S.ui.clienteDetalleId = existente.id; S.ui.clienteDetalleTab='investigacion';
    } else {
      const nuevo = {
        nombreEmpresa: d.nombreEmpresa, personaContacto:d.personaContacto, tipoCliente:d.tipoCliente||'Otro',
        telefono:d.telefono, whatsapp:d.whatsapp, email:d.email, instagram:d.instagram, web:d.web,
        estado:'Nuevo', prioridad:'BAJO', ciudad:d.ciudad, provincia:d.provincia,
        comercialId: null, creadoPor: S.session.userId,
        fechaAlta: todayISO(), investigacion
      };
      const ref = await S.fb.addDoc(col('crm2_clientes'), nuevo);
      logAction('Ficha importada (cliente nuevo)', d.nombreEmpresa);
      idFinal = ref.id; modo = 'CREADO NUEVO (no encontré uno con ese nombre exacto)';
      S.ui.clienteDetalleId = ref.id; S.ui.clienteDetalleTab='investigacion';
    }
    // Verificación: releemos lo que ha quedado guardado de verdad en Firestore
    const snap = await S.fb.getDoc(S.fb.doc(col('crm2_clientes'), idFinal));
    const guardado = snap.data();
    alert(`${modo}\n\nEsto es lo que ha quedado guardado:\nEmpresa: ${guardado.nombreEmpresa}\nInstagram: ${guardado.instagram || '(vacío)'}\nTeléfono: ${guardado.telefono || '(vacío)'}\nCiudad: ${guardado.ciudad || '(vacío)'}`);

   }catch(err){

// Dentro de la ficha de un cliente ya abierto: sube un archivo y rellena el formulario de Investigación (sin guardar todavía)
window.importarFichaCliente = function(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
   try{
    const d = parsearFichaTxt(e.target.result);
    const set = (id,val)=>{ const el=document.getElementById(id); if(el && val) el.value = val; };
    set('inv_naturaleza', d.naturaleza);
    set('inv_tamano', d.tamano);
    set('inv_actividad', d.actividad);
    set('inv_situacion', d.situacion);
    set('inv_oportunidad', d.oportunidad);
    set('inv_puntoEntrada', d.puntoEntrada);
    set('inv_observaciones', d.observaciones);
    const clienteId = S.ui.clienteDetalleId;
    const investigacion = { naturaleza:d.naturaleza, tamano:d.tamano, actividad:d.actividad, situacion:d.situacion, oportunidad:d.oportunidad, puntoEntrada:d.puntoEntrada, observaciones:d.observaciones, fecha:todayISO() };
    const patch = { investigacion };
    if(d.personaContacto) patch.personaContacto = d.personaContacto;
    if(d.tipoCliente) patch.tipoCliente = d.tipoCliente;
    if(d.telefono) patch.telefono = d.telefono;
    if(d.whatsapp) patch.whatsapp = d.whatsapp;
    if(d.email) patch.email = d.email;
    if(d.instagram) patch.instagram = d.instagram;
    if(d.web) patch.web = d.web;
    if(d.ciudad) patch.ciudad = d.ciudad;
    if(d.provincia) patch.provincia = d.provincia;
    await S.fb.updateDoc(S.fb.doc(col('crm2_clientes'), clienteId), patch);
    logAction('Ficha importada desde la ficha del cliente (datos de contacto + investigación)', S.clientes.find(x=>x.id===clienteId)?.nombreEmpresa || clienteId);
    const snap = await S.fb.getDoc(S.fb.doc(col('crm2_clientes'), clienteId));
    const guardado = snap.data();
    alert(`Guardado.\n\nEsto ha quedado en el cliente:\nInstagram: ${guardado.instagram || '(vacío)'}\nTeléfono: ${guardado.telefono || '(vacío)'}\nCiudad: ${guardado.ciudad || '(vacío)'}`);
    event.target.value = '';
    render();
   }catch(err){
     alert('ERROR al importar la ficha: ' + (err && err.message ? err.message : err));
     console.error(err);
   }
  };
  reader.readAsText(file, 'utf-8');
}

window.saveCliente = async function(id){
  if(!isAdmin()){ alert('Los comerciales no podéis editar la ficha del contacto directamente. Sube una ficha comercial (.txt), o avisa al administrador.'); return; }
  const g = k=>document.getElementById('cf_'+k).value;
  const data = {
    nombreEmpresa: g('nombreEmpresa').trim(), personaContacto:g('personaContacto').trim(),
    tipoCliente:g('tipoCliente'), telefono:g('telefono').trim(), whatsapp:g('whatsapp').trim(),
    email:g('email').trim().toLowerCase(), instagram:g('instagram').trim().replace(/^@/,''),
    web:g('web').trim(),
    estado:g('estado'), prioridad:g('prioridad'), ciudad:g('ciudad').trim(), provincia:g('provincia').trim(),
    comercialId: document.getElementById('cf_comercialId').value||null
  };
  if(!data.nombreEmpresa){ alert('El nombre de empresa es obligatorio.'); return; }

  if(id){ await S.fb.updateDoc(S.fb.doc(col('crm2_clientes'), id), data); logAction('Cliente editado', data.nombreEmpresa); }
  else{ data.fechaAlta = todayISO(); await S.fb.addDoc(col('crm2_clientes'), data); logAction('Cliente creado', data.nombreEmpresa); }
  S.ui.showClienteForm = null; render();
}

window.toggleSelectCliente = function(id, checked){

}
window.toggleSelectAllClientes = function(checked){
  const f = S.ui.clienteFiltro;
  let cs = misClientes();
  if(f.q) cs = cs.filter(c=> [c.nombreEmpresa,c.personaContacto,c.telefono,c.email,c.ciudad].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  if(f.comercial) cs = cs.filter(c=>c.comercialId===f.comercial);
  if(f.estado) cs = cs.filter(c=>c.estado===f.estado);
  if(f.tipo) cs = cs.filter(c=>c.tipoCliente===f.tipo);
  if(f.prioridad) cs = cs.filter(c=>c.prioridad===f.prioridad);
  if(f.investigacion==='hecha') cs = cs.filter(c=>!!c.investigacion);
  if(f.investigacion==='pendiente') cs = cs.filter(c=>!c.investigacion);
  const sel = S.ui.selectedIds || (S.ui.selectedIds = new Set());
  if(checked) cs.forEach(c=>sel.add(c.id)); else cs.forEach(c=>sel.delete(c.id));
  render();
}
window.deleteSelectedClientes = async function(){
  if(!isAdmin()){ alert('Solo el administrador puede eliminar clientes.'); return; }
  const sel = S.ui.selectedIds || (S.ui.selectedIds = new Set());
  if(!sel.size) return;
  if(!confirm(`¿Eliminar ${sel.size} cliente(s) seleccionados? Esta acción no se puede deshacer.`)) return;
  const ids = Array.from(sel);
  let batch = S.fb.writeBatch(S.db); let count=0;
  for(const id of ids){
    batch.delete(S.fb.doc(col('crm2_clientes'), id));
    count++;
    if(count===450){ await batch.commit(); batch = S.fb.writeBatch(S.db); count=0; }
  }
  if(count>0) await batch.commit();
  logAction('Eliminación múltiple de clientes', `${ids.length} cliente(s)`);
  sel.clear();
  render();
}

window.addContacto = async function(clienteId){

function viewComisiones(){
  if(!isAdmin()) return '<p style="color:var(--ink-dim)">No tienes acceso a esta sección.</p>';
  const rowsDe = cs => S.comisiones.filter(k=>cs.some(c=>c.id===k.clienteId)).map(k=>({...k, cliente:S.clientes.find(x=>x.id===k.clienteId)})).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));

  const tuyos = S.clientes.filter(c=>!c.comercialId);
  const rowsTuyos = rowsDe(tuyos);
  const totalTuyo = rowsTuyos.reduce((a,r)=>a+Number(r.valorTotal||0),0);

  const bloqueComercial = cm => {
    const propios = S.clientes.filter(c=>c.comercialId===cm.id);
    const rows = rowsDe(propios);
    const total = rows.reduce((a,r)=>a+Number(r.valorTotal||0),0);
    const pct = cm.pctComision!=null ? Number(cm.pctComision) : PCT_COMERCIAL_DEFECTO*100;
    return {cm, rows, total, pct, comision: total*(pct/100)};
  };
  const bloques = S.comerciales.map(bloqueComercial);
  const totalGeneral = totalTuyo*PCT_ADMIN + bloques.reduce((a,b)=>a+b.comision,0);

  const tabla = (rows, pct) => `
    <div class="overflow-x-auto"><table>
      <thead><tr><th>Fecha</th><th>Cliente</th><th>Evento</th><th>Entradas</th><th>Valor vendido</th><th>Comisión (${pct}%)</th></tr></thead>
      <tbody>${rows.length? rows.map(r=>`<tr>
        <td>${fdate(r.fecha)}</td><td class="font-semibold">${esc(r.cliente?.nombreEmpresa||'-')}</td>
        <td>${esc(r.evento)}</td><td>${numf(r.entradas)}</td><td>${money(r.valorTotal)}</td><td>${money(r.valorTotal*(pct/100))}</td></tr>`).join('') : `<tr><td colspan="6" style="color:var(--ink-dim)">Sin ventas registradas.</td></tr>`}</tbody>
    </table></div>`;

  return `
  <h2 class="text-xl font-bold mb-1">Comisiones</h2>
  <p class="text-sm mb-5" style="color:var(--ink-dim)">Visible solo para ti. Cada comercial tiene su propio % (editable en la pestaña Comerciales); tú, sobre tus clientes sin asignar, cobras el ${(PCT_ADMIN*100)}%.</p>
  <div class="panel p-4 mb-5"><div class="kicker">Comisión total generada (todos)</div><div class="stat-num" style="color:var(--accent)">${money(totalGeneral)}</div></div>

  <div class="panel p-4 mb-4">
    <div class="flex justify-between items-center mb-3">
      <div class="font-bold">Tuyas (clientes sin asignar) · ${(PCT_ADMIN*100)}%</div>
      <div class="text-sm">Ventas: <b>${money(totalTuyo)}</b> · Comisión: <b style="color:var(--accent)">${money(totalTuyo*PCT_ADMIN)}</b></div>
    </div>
    ${tabla(rowsTuyos, PCT_ADMIN*100)}
  </div>

  ${bloques.map(b=>`
    <div class="panel p-4 mb-4">
      <div class="flex justify-between items-center mb-3">
        <div class="font-bold">${esc(b.cm.nombre)} · ${b.pct}% <button class="btn btn-ghost text-xs ml-2" onclick="editarPctComercial('${b.cm.id}')">editar %</button></div>
        <div class="text-sm">Ventas: <b>${money(b.total)}</b> · Comisión: <b style="color:var(--accent)">${money(b.comision)}</b></div>
      </div>
      ${tabla(b.rows, b.pct)}
    </div>
  `).join('')}
  `;
}
window.editarPctComercial = async function(id){
  const cm = S.comerciales.find(x=>x.id===id);
  const actual = cm.pctComision!=null ? cm.pctComision : PCT_COMERCIAL_DEFECTO*100;
  const nuevo = prompt(`Nuevo % de comisión para ${cm.nombre}:`, actual);
  if(nuevo==null) return;
  const num = parseFloat(nuevo);
  if(isNaN(num)||num<0){ alert('Valor no válido.'); return; }
  await S.fb.updateDoc(S.fb.doc(col('crm2_comerciales'), id), {pctComision:num});
  logAction('% de comisión editado', `${cm.nombre} → ${num}%`);
  render();
}

window.deleteComercial = async function(id){
  if(!isAdmin()){ alert('Solo el administrador puede eliminar comerciales.'); return; }
  const cm = S.comerciales.find(x=>x.id===id);
  if(!cm) return;
  const clientesAsignados = S.clientes.filter(c=>c.comercialId===id);
  const aviso = `¿Eliminar al comercial "${cm.nombre}"?` +
    (clientesAsignados.length ? `\n\nTiene ${clientesAsignados.length} cliente(s) asignado(s); se quedarán sin comercial (pasan a ser tuyos).` : '') +
    `\n\nTambién se eliminará su acceso al CRM (ya no podrá iniciar sesión). Esta acción no se puede deshacer.`;
  if(!confirm(aviso)) return;
  for(const c of clientesAsignados){
    await S.fb.updateDoc(S.fb.doc(col('crm2_clientes'), c.id), {comercialId:null});
  }
  const snapUsers = await S.fb.getDocs(S.fb.query(col('crm2_users'), S.fb.where('comercialId','==',id)));
  for(const d of snapUsers.docs){ await S.fb.deleteDoc(S.fb.doc(col('crm2_users'), d.id)); }
  await S.fb.deleteDoc(S.fb.doc(col('crm2_comerciales'), id));
  logAction('Comercial eliminado', cm.nombre);
  render();
}

window.handleCsvFile = function(){
  const file = document.getElementById('csvFile').files[0];
  if(!file){ alert('Selecciona un archivo CSV.'); return; }
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: res => processImport(res.data)
  });
}
function normPhone(s){ return (s||'').replace(/\D/g,''); }
function processImport(rows){
  const existingEmails = new Set(S.clientes.map(c=>(c.email||'').toLowerCase()).filter(Boolean));
  const existingPhones = new Set(S.clientes.map(c=>normPhone(c.telefono)).filter(Boolean));
  const get = (r,...keys)=>{ for(const k of keys){ const found = Object.keys(r).find(kk=>kk.trim().toLowerCase()===k); if(found && r[found]) return r[found]; } return ''; };
  const mapped = rows.map(r=>({
    nombreEmpresa: get(r,'empresa','nombre de empresa','sala','compañía')||get(r,'nombre'),
    personaContacto: get(r,'nombre','persona de contacto','contacto'),
    telefono: get(r,'teléfono','telefono','tel','whatsapp'),
    email: get(r,'email','correo').toLowerCase(),
    instagram: get(r,'instagram').replace(/^@/,''),
    ciudad: get(r,'ciudad'),
    provincia: get(r,'provincia'),
    tipoCliente: get(r,'tipo de cliente','tipo')||'Otro'
  })).filter(r=>r.nombreEmpresa);
  mapped.forEach(r=>{ r.dup = (r.email && existingEmails.has(r.email)) || (r.telefono && existingPhones.has(normPhone(r.telefono))); });
  S.ui.importRows = mapped;
  const dupes = mapped.filter(r=>r.dup).length;
  document.getElementById('importResult').innerHTML = `
    <div class="text-sm mb-2">${mapped.length} filas leídas · <span style="color:${dupes?'var(--warn)':'var(--accent)'}">${dupes} posibles duplicados detectados</span></div>
    <div class="max-h-64 overflow-y-auto panel2 p-2 mb-3 text-xs">
      ${mapped.slice(0,300).map(r=>`<div class="flex justify-between py-1 border-b" style="border-color:var(--line)"><span>${esc(r.nombreEmpresa)} ${r.dup?'<span class=\"badge\" style=\"background:#332626;color:#e0603e\">DUPLICADO</span>':''}</span><span style="color:var(--ink-dim)">${esc(r.email||r.telefono||'')}</span></div>`).join('')}
      ${mapped.length>300?`<div class="text-center pt-2" style="color:var(--ink-dim)">... y ${mapped.length-300} más</div>`:''}
    </div>
    <button class="btn btn-accent" onclick="confirmImport(false)">Importar ${mapped.length-dupes} nuevos (omitir duplicados)</button>
    <button class="btn btn-ghost ml-2" onclick="confirmImport(true)">Importar todos igualmente</button>
  `;
}
window.confirmImport = async function(includeDupes){
  const rows = includeDupes ? S.ui.importRows : S.ui.importRows.filter(r=>!r.dup);
  let batch = S.fb.writeBatch(S.db); let count=0; let total=0;
  for(const r of rows){
    const ref = S.fb.doc(col('crm2_clientes'));
    batch.set(ref, {
      nombreEmpresa:r.nombreEmpresa, personaContacto:r.personaContacto, telefono:r.telefono, email:r.email, instagram:r.instagram,
      ciudad:r.ciudad, provincia:r.provincia, tipoCliente:r.tipoCliente, estado:'Nuevo', prioridad:'BAJO',
      comercialId: isAdmin()? null : S.session.comercialId, fechaAlta:todayISO()
    });
    count++; total++;
    if(count===450){ await batch.commit(); batch = S.fb.writeBatch(S.db); count=0; }
  }
  if(count>0) await batch.commit();
  logAction('Importación CSV', `${total} clientes importados`);
  alert(`${total} clientes importados correctamente.`);
  document.getElementById('importResult').innerHTML='';
  S.ui.importRows=[];
}
window.exportCsv = function(){
  if(!isOwner()){ logAction('Intento de descarga bloqueado', 'Sin permiso'); alert('No tienes permiso para descargar la base de datos.'); return; }
  logAction('Exportación CSV', '');
  const f = S.ui.clienteFiltro;
  let cs = misClientes().map(c=>({...c,...calcPotencial(c)}));
  if(f.q) cs = cs.filter(c=> [c.nombreEmpresa,c.personaContacto,c.telefono,c.email,c.ciudad].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  if(f.comercial) cs = cs.filter(c=>c.comercialId===f.comercial);
  if(f.estado) cs = cs.filter(c=>c.estado===f.estado);
  if(f.tipo) cs = cs.filter(c=>c.tipoCliente===f.tipo);
  if(f.prioridad) cs = cs.filter(c=>c.prioridad===f.prioridad);
  if(f.investigacion==='hecha') cs = cs.filter(c=>!!c.investigacion);
  if(f.investigacion==='pendiente') cs = cs.filter(c=>!c.investigacion);
  const data = cs.map(c=>({
    Empresa:c.nombreEmpresa, Contacto:c.personaContacto, Telefono:c.telefono, Email:c.email, Instagram:c.instagram, Ciudad:c.ciudad, Provincia:c.provincia,
    Tipo:c.tipoCliente, Estado:c.estado, Comercial:nombreComercial(c.comercialId),
    VentasRegistradas:c.ventasAnuales, RetornoRegistrado:c.retornoAnual, Prioridad:c.prioridad
  }));
  const csv = Papa.unparse(data);
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'entradasya_clientes.csv'; a.click();
}

      <td style="color:var(--ink-dim)">${esc(l.detalle||'-')}</td></tr>`).join('') : `<tr><td colspan="5" style="color:var(--ink-dim)">Sin actividad registrada todavía.</td></tr>`}</tbody>
  </table></div></div>`;
}

/* ===================== INICIO ===================== */
window.addEventListener('fb-ready', ()=>{ render(); });
</script>
</body>
