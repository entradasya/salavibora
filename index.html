<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EntradasYa CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc,
  onSnapshot, query, where, writeBatch, getDocs, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
window.__fb = { initializeApp, getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, where, writeBatch, getDocs, getDoc, serverTimestamp };
window.dispatchEvent(new Event("fb-ready"));
</script>
<style>
  :root{
    --bg:#0f1720; --panel:#16202b; --panel2:#1c2733; --line:#26333f;
    --ink:#e7edf3; --ink-dim:#8fa1b0; --accent:#3ecf8e; --accent-dim:#255c46;
    --warn:#e0a53e; --danger:#e0603e; --info:#4d8ff0;
  }
  body{background:var(--bg); color:var(--ink); font-family:'Inter',ui-sans-serif,system-ui,sans-serif;}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:#2c3a48;border-radius:4px;}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px;}
  .panel2{background:var(--panel2); border:1px solid var(--line); border-radius:8px;}
  .btn{padding:.55rem 1rem; border-radius:8px; font-weight:600; font-size:.875rem; transition:.15s; cursor:pointer;}
  .btn-accent{background:var(--accent); color:#08130d;} .btn-accent:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; border:1px solid var(--line); color:var(--ink);} .btn-ghost:hover{border-color:#3a4a5a;}
  .btn-danger{background:var(--danger); color:#1a0704;} .btn-danger:hover{filter:brightness(1.1);}
  input,select,textarea{background:#0f1720; border:1px solid var(--line); color:var(--ink); border-radius:7px; padding:.5rem .65rem; font-size:.875rem; width:100%;}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent);}
  label{font-size:.72rem; color:var(--ink-dim); font-weight:600; letter-spacing:.02em;}
  .navitem{display:flex; align-items:center; gap:.6rem; padding:.6rem .8rem; border-radius:8px; color:var(--ink-dim); cursor:pointer; font-size:.875rem; font-weight:500;}
  .navitem:hover{background:var(--panel2); color:var(--ink);}
  .navitem.active{background:var(--accent-dim); color:var(--accent);}
  .badge{padding:.15rem .55rem; border-radius:999px; font-size:.7rem; font-weight:700; letter-spacing:.02em; white-space:nowrap;}
  table{width:100%; border-collapse:collapse; font-size:.83rem;}
  th{text-align:left; color:var(--ink-dim); font-weight:600; font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; padding:.5rem .7rem; border-bottom:1px solid var(--line);}
  td{padding:.55rem .7rem; border-bottom:1px solid var(--line);}
  tr.row:hover{background:var(--panel2); cursor:pointer;}
  .modal-bg{position:fixed; inset:0; background:rgba(6,10,14,.7); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:2rem 1rem; overflow-y:auto;}
  .tab{padding:.5rem .9rem; border-radius:7px; font-size:.8rem; font-weight:600; color:var(--ink-dim); cursor:pointer;}
  .tab.active{background:var(--panel2); color:var(--accent);}
  .stat-num{font-size:1.7rem; font-weight:800; line-height:1;}
  .kicker{font-size:.68rem; color:var(--ink-dim); font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
</style>
</head>
<body>
<div id="app" class="min-h-screen"></div>

<script>
/* ===================== ESTADO GLOBAL ===================== */
const S = {
  fbApp:null, db:null, fb:null,
  config: JSON.parse(localStorage.getItem('ey_fb_config')||'null'),
  session: JSON.parse(localStorage.getItem('ey_session')||'null'),
  comerciales:[], clientes:[], eventos:[], contactos:[], comisiones:[],
  listenersOn:false,
  ui:{ view:'dashboard', clienteFiltro:{q:'',comercial:'',estado:'',tipo:'',prioridad:''}, clienteDetalleId:null, clienteDetalleTab:'potencial', importStep:0, importRows:[], importDupes:[] }
};
const PCT = 0.04;
const money = n => (isFinite(n)?n:0).toLocaleString('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const numf = n => (isFinite(n)?n:0).toLocaleString('es-ES');
const fdate = d => { if(!d) return '-'; const dt = (d instanceof Date)? d : new Date(d); if(isNaN(dt)) return '-'; return dt.toLocaleDateString('es-ES'); };
const todayISO = () => new Date().toISOString().slice(0,10);
const uid = () => Math.random().toString(36).slice(2,10);

const ESTADOS = ["Nuevo","Contactado","Interesado","Seguimiento","Negociación","Primer evento","Cliente activo","Cliente recurrente","Perdido"];
const TIPOS = ["Sala","Discoteca","Promotor","Productora","Festival","Asociación","Teatro","Organizador","Artista / manager","Otro"];
const TIPOS_CONTACTO = ["Llamada","WhatsApp","Email","Instagram","Reunión","Videollamada","Otro"];
const RESULTADOS = ["No contesta","Contactado","Interesado","Quiere información","Quiere reunión","Quiere probar EntradasYa.es","Negociación","Cliente conseguido","No interesado"];

function calcPotencial(c){
  const eventosAnio = Number(c.eventosAnio)||0;
  const mediaEntradas = Number(c.mediaEntradas)||0;
  const precioMedio = Number(c.precioMedio)||0;
  const entradasAnuales = eventosAnio*mediaEntradas;
  const ventasAnuales = entradasAnuales*precioMedio;
  const retornoAnual = ventasAnuales*PCT;
  const retornoMensual = retornoAnual/12;
  return {entradasAnuales, ventasAnuales, retornoAnual, retornoMensual, prioridad:prioridadDe(retornoAnual)};
}
function prioridadDe(retornoAnual){
  if(retornoAnual>10000) return 'ESTRATÉGICO';
  if(retornoAnual>=5000) return 'ALTO';
  if(retornoAnual>=2000) return 'MEDIO';
  return 'BAJO';
}
function prioridadColor(p){
  return {BAJO:'background:#2a2f22;color:#a9c15a', MEDIO:'background:#2a2c1e;color:#e0c23e', ALTO:'background:#2c2418;color:#e0a53e', 'ESTRATÉGICO':'background:#26332c;color:#3ecf8e'}[p]||'';
}
function estadoColor(e){
  const map = {Nuevo:'#4d8ff0', Contactado:'#4d8ff0', Interesado:'#e0c23e', Seguimiento:'#e0a53e', Negociación:'#e0a53e', 'Primer evento':'#3ecf8e', 'Cliente activo':'#3ecf8e', 'Cliente recurrente':'#3ecf8e', Perdido:'#e0603e'};
  return map[e]||'#8fa1b0';
}

/* ===================== FIREBASE ===================== */
function connectFirebase(cfg){
  S.fb = window.__fb;
  S.fbApp = S.fb.initializeApp(cfg);
  S.db = S.fb.getFirestore(S.fbApp);
  S.config = cfg;
  localStorage.setItem('ey_fb_config', JSON.stringify(cfg));
}
function col(name){ return S.fb.collection(S.db, name); }

function startListeners(){
  if(S.listenersOn) return;
  S.listenersOn = true;
  S.fb.onSnapshot(col('crm2_comerciales'), snap=>{ S.comerciales = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_clientes'), snap=>{ S.clientes = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_eventos'), snap=>{ S.eventos = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_contactos'), snap=>{ S.contactos = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
  S.fb.onSnapshot(col('crm2_comisiones'), snap=>{ S.comisiones = snap.docs.map(d=>({id:d.id,...d.data()})); render(); });
}

async function ensureAdminBootstrap(){
  const snap = await S.fb.getDocs(col('crm2_users'));
  return snap.size===0;
}

/* ===================== RENDER RAÍZ ===================== */
function render(){
  const root = document.getElementById('app');
  if(!S.config){ root.innerHTML = viewSetup(); return; }
  if(!S.db){ connectFirebase(S.config); }
  if(!S.session){ root.innerHTML = viewCheckingOrLogin(); if(!S._checked){ checkBootstrap(); } return; }
  startListeners();
  root.innerHTML = viewApp();
}
let bootstrapNeeded = null;
async function checkBootstrap(){
  S._checked = true;
  bootstrapNeeded = await ensureAdminBootstrap();
  render2();
}
function render2(){ document.getElementById('app').innerHTML = viewCheckingOrLogin(); }

/* ===================== VISTA: SETUP FIREBASE ===================== */
function viewSetup(){
  return `
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="panel p-8 w-full max-w-lg">
      <h1 class="text-xl font-bold mb-1">EntradasYa CRM</h1>
      <p class="text-sm mb-5" style="color:var(--ink-dim)">Conecta tu base de datos gratuita (Firebase Firestore). Crea un proyecto gratis en console.firebase.google.com, activa Firestore, copia el objeto de configuración web y pégalo aquí.</p>
      <label>Configuración Firebase (objeto JSON)</label>
      <textarea id="cfgInput" rows="8" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea>
      <div id="cfgErr" class="text-sm mt-2" style="color:var(--danger)"></div>
      <button class="btn btn-accent w-full mt-4" onclick="submitConfig()">Guardar y conectar</button>
    </div>
  </div>`;
}
window.submitConfig = function(){
  const txt = document.getElementById('cfgInput').value.trim();
  try{
    const cfg = JSON.parse(txt);
    if(!cfg.projectId || !cfg.apiKey) throw new Error('faltan campos');
    connectFirebase(cfg);
    render();
  }catch(e){ document.getElementById('cfgErr').textContent = 'JSON no válido. Revisa que hayas copiado el objeto completo.'; }
}

/* ===================== VISTA: LOGIN / BOOTSTRAP ===================== */
function viewCheckingOrLogin(){
  if(bootstrapNeeded===null){
    return `<div class="min-h-screen flex items-center justify-center"><p style="color:var(--ink-dim)">Conectando...</p></div>`;
  }
  if(bootstrapNeeded){
    return `
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="panel p-8 w-full max-w-md">
        <h1 class="text-xl font-bold mb-1">Crear administrador</h1>
        <p class="text-sm mb-5" style="color:var(--ink-dim)">No hay usuarios todavía. Crea la cuenta de administrador principal.</p>
        <div class="space-y-3">
          <div><label>Nombre</label><input id="bNombre"></div>
          <div><label>Email</label><input id="bEmail" type="email"></div>
          <div><label>Contraseña</label><input id="bPass" type="password"></div>
        </div>
        <div id="bErr" class="text-sm mt-2" style="color:var(--danger)"></div>
        <button class="btn btn-accent w-full mt-4" onclick="createAdmin()">Crear administrador</button>
      </div>
    </div>`;
  }
  return `
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="panel p-8 w-full max-w-md">
      <h1 class="text-xl font-bold mb-1">EntradasYa CRM</h1>
      <p class="text-sm mb-5" style="color:var(--ink-dim)">Inicia sesión para continuar.</p>
      <div class="space-y-3">
        <div><label>Email</label><input id="lEmail" type="email"></div>
        <div><label>Contraseña</label><input id="lPass" type="password"></div>
      </div>
      <div id="lErr" class="text-sm mt-2" style="color:var(--danger)"></div>
      <button class="btn btn-accent w-full mt-4" onclick="doLogin()">Entrar</button>
    </div>
  </div>`;
}
window.createAdmin = async function(){
  const nombre = document.getElementById('bNombre').value.trim();
  const email = document.getElementById('bEmail').value.trim().toLowerCase();
  const pass = document.getElementById('bPass').value;
  if(!nombre||!email||!pass){ document.getElementById('bErr').textContent='Rellena todos los campos.'; return; }
  await S.fb.setDoc(S.fb.doc(col('crm2_users'), uid()), {nombre, email, pass, role:'admin', comercialId:null, creado:todayISO()});
  bootstrapNeeded = false;
  S.session = {email, nombre, role:'admin', comercialId:null};
  localStorage.setItem('ey_session', JSON.stringify(S.session));
  render();
}
window.doLogin = async function(){
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const pass = document.getElementById('lPass').value;
  const snap = await S.fb.getDocs(S.fb.query(col('crm2_users'), S.fb.where('email','==',email)));
  const u = snap.docs.map(d=>({id:d.id,...d.data()})).find(x=>x.pass===pass);
  if(!u){ document.getElementById('lErr').textContent='Email o contraseña incorrectos.'; return; }
  S.session = {email:u.email, nombre:u.nombre, role:u.role, comercialId:u.comercialId||null};
  localStorage.setItem('ey_session', JSON.stringify(S.session));
  render();
}
window.doLogout = function(){ S.session=null; localStorage.removeItem('ey_session'); render(); }

/* ===================== SHELL APP ===================== */
function isAdmin(){ return S.session && S.session.role==='admin'; }
const OWNER_EMAIL = 'danielgomezgarcia1980@gmail.com';
function isOwner(){ return S.session && S.session.email===OWNER_EMAIL; }
function misClientes(){
  if(isAdmin()) return S.clientes;
  // Cada comercial ve sus propios clientes asignados + el "pool" de contactos sin asignar todavía.
  // En cuanto uno de ellos edita un contacto sin asignar, se le asigna automáticamente (ver saveCliente)
  // y deja de ser visible/editable para el resto.
  return S.clientes.filter(c=>c.comercialId===S.session.comercialId || !c.comercialId);
}
// Puede este usuario editar/abrir este cliente en concreto (comprobación de refuerzo,
// además del filtrado de listas de misClientes()).
function puedeEditar(c){
  if(!c) return false;
  if(isAdmin()) return true;
  return !c.comercialId || c.comercialId===S.session.comercialId;
}
function viewApp(){
  const nav = [
    ['dashboard','Panel'],['clientes','Clientes'],['seguimientos','Seguimientos'],
    ['comisiones','Comisiones'], ...(isAdmin()?[['comerciales','Comerciales'],['importar','Importar / Exportar']]:[])
  ];
  return `
  <div class="flex min-h-screen">
    <aside class="w-56 shrink-0 border-r p-4 flex flex-col" style="border-color:var(--line)">
      <div class="mb-6">
        <div class="font-extrabold text-lg">EntradasYa</div>
        <div class="kicker">CRM comercial</div>
      </div>
      <nav class="space-y-1 flex-1">
        ${nav.map(([k,l])=>`<div class="navitem ${S.ui.view===k?'active':''}" onclick="setView('${k}')">${l}</div>`).join('')}
      </nav>
      <div class="pt-4 border-t" style="border-color:var(--line)">
        <div class="text-sm font-semibold">${S.session.nombre||S.session.email}</div>
        <div class="text-xs mb-3" style="color:var(--ink-dim)">${isAdmin()?'Administrador':'Comercial'}</div>
        <button class="btn btn-ghost w-full text-xs" onclick="doLogout()">Cerrar sesión</button>
      </div>
    </aside>
    <main class="flex-1 p-6 overflow-x-hidden">
      ${ S.ui.view==='dashboard' ? viewDashboard() :
         S.ui.view==='clientes' ? viewClientes() :
         S.ui.view==='seguimientos' ? viewSeguimientos() :
         S.ui.view==='comisiones' ? viewComisiones() :
         S.ui.view==='comerciales' ? viewComerciales() :
         S.ui.view==='importar' ? viewImportar() : '' }
    </main>
  </div>
  ${S.ui.clienteDetalleId ? modalClienteDetalle() : ''}
  ${S.ui.showComercialForm ? modalComercialForm() : ''}
  ${S.ui.showClienteForm ? modalClienteForm() : ''}
  `;
}
window.setView = function(v){ S.ui.view=v; render(); }

/* ===================== DASHBOARD ===================== */
function viewDashboard(){
  const cs = misClientes();
  const total = cs.length;
  const porEstado = e => cs.filter(c=>c.estado===e).length;
  const nuevos = porEstado('Nuevo');
  const contactados = cs.filter(c=>['Contactado','Interesado','Seguimiento','Negociación'].includes(c.estado)).length;
  const interesados = porEstado('Interesado');
  const negociacion = porEstado('Negociación');
  const activos = cs.filter(c=>['Cliente activo','Cliente recurrente','Primer evento'].includes(c.estado)).length;
  const perdidos = porEstado('Perdido');
  const hoy = todayISO();
  const proximos = cs.filter(c=>c.proximoSeguimiento && c.proximoSeguimiento>=hoy).length;
  let ventasPotTotal=0, retornoPotTotal=0;
  cs.forEach(c=>{ const p=calcPotencial(c); ventasPotTotal+=p.ventasAnuales; retornoPotTotal+=p.retornoAnual; });
  const ranking = [...cs].map(c=>({...c,...calcPotencial(c)})).sort((a,b)=>b.retornoAnual-a.retornoAnual).slice(0,10);

  const stat = (label,val,color)=>`
    <div class="panel p-4">
      <div class="kicker">${label}</div>
      <div class="stat-num" style="${color?`color:${color}`:''}">${val}</div>
    </div>`;

  return `
  <div class="mb-5">
    <h2 class="text-xl font-bold">Panel principal</h2>
    <p class="text-sm" style="color:var(--ink-dim)">Resumen ${isAdmin()?'global':'de tu cartera'}, actualizado en tiempo real.</p>
  </div>
  <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
    ${stat('Total clientes', numf(total))}
    ${stat('Nuevos', numf(nuevos), '#4d8ff0')}
    ${stat('Contactados', numf(contactados))}
    ${stat('Interesados', numf(interesados),'#e0c23e')}
    ${stat('En negociación', numf(negociacion),'#e0a53e')}
    ${stat('Clientes activos', numf(activos),'#3ecf8e')}
    ${stat('Perdidos', numf(perdidos),'#e0603e')}
    ${stat('Seguimientos pendientes', numf(proximos))}
  </div>
  <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mb-6">
    ${stat('Ventas potenciales / año', money(ventasPotTotal))}
    ${stat('Retorno potencial / año (4%)', money(retornoPotTotal),'#3ecf8e')}
    ${stat('Retorno potencial / mes', money(retornoPotTotal/12))}
  </div>
  <div class="panel p-4">
    <div class="font-bold mb-3">Ranking de clientes por potencial económico</div>
    <div class="overflow-x-auto">
    <table>
      <thead><tr><th>Cliente</th><th>Tipo</th><th>Ventas/año</th><th>Retorno 4%/año</th><th>Prioridad</th></tr></thead>
      <tbody>
        ${ranking.length? ranking.map(c=>`
          <tr class="row" onclick="openCliente('${c.id}')">
            <td class="font-semibold">${esc(c.nombreEmpresa)}</td>
            <td style="color:var(--ink-dim)">${esc(c.tipoCliente||'-')}</td>
            <td>${money(c.ventasAnuales)}</td>
            <td>${money(c.retornoAnual)}</td>
            <td><span class="badge" style="${prioridadColor(c.prioridad)}">${c.prioridad}</span></td>
          </tr>`).join('') : `<tr><td colspan="5" style="color:var(--ink-dim)">Todavía no hay clientes con potencial calculado.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>
  ${isAdmin()? viewRendimientoComerciales() : ''}
  `;
}
function viewRendimientoComerciales(){
  const rows = S.comerciales.map(cm=>{
    const propios = S.clientes.filter(c=>c.comercialId===cm.id);
    const conseguidos = propios.filter(c=>['Cliente activo','Cliente recurrente','Primer evento'].includes(c.estado)).length;
    const ventas = S.comisiones.filter(k=>propios.some(p=>p.id===k.clienteId)).reduce((a,k)=>a+Number(k.valorTotal||0),0);
    const comision = ventas*PCT;
    return {cm, propios:propios.length, conseguidos, ventas, comision};
  });
  return `
  <div class="panel p-4 mt-4">
    <div class="font-bold mb-3">Rendimiento por comercial</div>
    <div class="overflow-x-auto">
    <table>
      <thead><tr><th>Comercial</th><th>Clientes</th><th>Conseguidos</th><th>Ventas generadas</th><th>Comisión (4%)</th></tr></thead>
      <tbody>
      ${rows.length? rows.map(r=>`<tr><td class="font-semibold">${esc(r.cm.nombre)}</td><td>${r.propios}</td><td>${r.conseguidos}</td><td>${money(r.ventas)}</td><td>${money(r.comision)}</td></tr>`).join('') : `<tr><td colspan="5" style="color:var(--ink-dim)">Sin comerciales todavía.</td></tr>`}
      </tbody>
    </table>
    </div>
  </div>`;
}

/* ===================== CLIENTES ===================== */
function viewClientes(){
  const f = S.ui.clienteFiltro;
  let cs = misClientes().map(c=>({...c,...calcPotencial(c)}));
  if(f.q) cs = cs.filter(c=> [c.nombreEmpresa,c.personaContacto,c.telefono,c.email,c.ciudad].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  if(f.comercial) cs = cs.filter(c=>c.comercialId===f.comercial);
  if(f.estado) cs = cs.filter(c=>c.estado===f.estado);
  if(f.tipo) cs = cs.filter(c=>c.tipoCliente===f.tipo);
  if(f.prioridad) cs = cs.filter(c=>c.prioridad===f.prioridad);
  cs.sort((a,b)=>b.retornoAnual-a.retornoAnual);

  const comercialOpt = cm => `<option value="${cm.id}" ${f.comercial===cm.id?'selected':''}>${esc(cm.nombre)}</option>`;
  const sel = S.ui.selectedIds || (S.ui.selectedIds = new Set());
  const visibleIds = cs.map(c=>c.id);
  const allSelected = visibleIds.length>0 && visibleIds.every(id=>sel.has(id));

  return `
  <div class="flex items-center justify-between mb-5">
    <div>
      <h2 class="text-xl font-bold">Clientes</h2>
      <p class="text-sm" style="color:var(--ink-dim)">${cs.length} resultado(s)${sel.size?` · ${sel.size} seleccionado(s)`:''}</p>
    </div>
    <div class="flex gap-2">
      ${isAdmin() && sel.size ? `<button class="btn btn-danger" onclick="deleteSelectedClientes()">Eliminar seleccionados (${sel.size})</button>` : ''}
      <button class="btn btn-accent" onclick="openClienteForm()">+ Nuevo cliente</button>
    </div>
  </div>
  <div class="panel p-3 mb-4 grid grid-cols-2 md:grid-cols-6 gap-2">
    <input class="md:col-span-2" placeholder="Buscar nombre, contacto, tel, email, ciudad" value="${esc(f.q)}" oninput="setFiltro('q',this.value)">

window.saveCliente = async function(id){
  const g = k=>document.getElementById('cf_'+k).value;
  const data = {
    nombreEmpresa: g('nombreEmpresa').trim(), personaContacto:g('personaContacto').trim(),
    tipoCliente:g('tipoCliente'), telefono:g('telefono').trim(), whatsapp:g('whatsapp').trim(),
    email:g('email').trim().toLowerCase(), estado:g('estado'), ciudad:g('ciudad').trim(), provincia:g('provincia').trim(),
    eventosAnio:Number(g('eventosAnio'))||0, mediaEntradas:Number(g('mediaEntradas'))||0, precioMedio:Number(g('precioMedio'))||0
  };
  if(!data.nombreEmpresa){ alert('El nombre de empresa es obligatorio.'); return; }

  if(isAdmin()){
    // El admin es el único que puede reasignar o dejar sin asignar manualmente.
    data.comercialId = document.getElementById('cf_comercialId').value||null;
  } else if(id){
    // Comprobación anti-carrera: releemos el documento justo antes de guardar por si
    // otro comercial lo ha reclamado entretanto.
    const fresh = await S.fb.getDoc(S.fb.doc(col('crm2_clientes'), id));
    const freshData = fresh.exists() ? fresh.data() : null;
    if(!freshData || (freshData.comercialId && freshData.comercialId!==S.session.comercialId)){
      alert('Este contacto acaba de ser asignado a otro comercial. Se han descartado tus cambios.');
      S.ui.showClienteForm = null; render(); return;
    }
    // Sin asignar o ya asignado a mí: lo reclamo/mantengo al guardar.
    data.comercialId = S.session.comercialId;
  } else {
    // Cliente nuevo creado por un comercial: queda asignado directamente a quien lo crea.
    data.comercialId = S.session.comercialId;
  }

  if(id){ await S.fb.updateDoc(S.fb.doc(col('crm2_clientes'), id), data); }
  else{ data.fechaAlta = todayISO(); await S.fb.addDoc(col('crm2_clientes'), data); }
  S.ui.showClienteForm = null; render();
}
window.deleteCliente = async function(id){
  if(!isAdmin()){ alert('Solo el administrador puede eliminar clientes.'); return; }
  if(!confirm('¿Eliminar este cliente? Esta acción no se puede deshacer.')) return;
  await S.fb.deleteDoc(S.fb.doc(col('crm2_clientes'), id));
  S.ui.clienteDetalleId=null; render();
}

}
window.toggleSelectAllClientes = function(checked){
  const f = S.ui.clienteFiltro;
  let cs = misClientes();
  if(f.q) cs = cs.filter(c=> [c.nombreEmpresa,c.personaContacto,c.telefono,c.email,c.ciudad].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  if(f.comercial) cs = cs.filter(c=>c.comercialId===f.comercial);
  if(f.estado) cs = cs.filter(c=>c.estado===f.estado);
  if(f.tipo) cs = cs.filter(c=>c.tipoCliente===f.tipo);
  if(f.prioridad) cs = cs.filter(c=>c.prioridad===f.prioridad);
  const sel = S.ui.selectedIds || (S.ui.selectedIds = new Set());
  if(checked) cs.forEach(c=>sel.add(c.id)); else cs.forEach(c=>sel.delete(c.id));
  render();
}
window.deleteSelectedClientes = async function(){
  const sel = S.ui.selectedIds || (S.ui.selectedIds = new Set());
  if(!sel.size) return;
  if(!confirm(`¿Eliminar ${sel.size} cliente(s) seleccionados? Esta acción no se puede deshacer.`)) return;
  const ids = Array.from(sel);
  let batch = S.fb.writeBatch(S.db); let count=0;
  for(const id of ids){
    batch.delete(S.fb.doc(col('crm2_clientes'), id));
    count++;
    if(count===450){ await batch.commit(); batch = S.fb.writeBatch(S.db); count=0; }
  }
  if(count>0) await batch.commit();
  sel.clear();
  render();
}

function viewSeguimientos(){
  const hoy = todayISO();
  const cs = misClientes().filter(c=>c.proximoSeguimiento);
  const atrasados = cs.filter(c=>c.proximoSeguimiento<hoy).sort((a,b)=>a.proximoSeguimiento.localeCompare(b.proximoSeguimiento));
  const hoyList = cs.filter(c=>c.proximoSeguimiento===hoy);
  const proximos = cs.filter(c=>c.proximoSeguimiento>hoy).sort((a,b)=>a.proximoSeguimiento.localeCompare(b.proximoSeguimiento));
  const tabla = (list,label,color)=>`

        <thead><tr><th>Cliente</th><th>Comercial</th><th>Último contacto</th><th>Próxima acción</th><th>Fecha</th></tr></thead>
        <tbody>${list.length? list.map(c=>{
          const ultimo = S.contactos.filter(h=>h.clienteId===c.id).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''))[0];
          return `<tr class="row" onclick="openCliente('${c.id}')">
            <td class="font-semibold">${esc(c.nombreEmpresa)}</td>
            <td style="color:var(--ink-dim)">${nombreComercial(c.comercialId)}</td>
            <td>${fdate(c.ultimoContacto)}</td>
            <td>${esc(ultimo?.proximoPaso||'-')}</td>
            <td>${fdate(c.proximoSeguimiento)}</td></tr>`;
        }).join('') : `<tr><td colspan="5" style="color:var(--ink-dim)">Nada aquí.</td></tr>`}</tbody>
      </table></div>
    </div>`;
  return `
  <h2 class="text-xl font-bold mb-1">Seguimientos</h2>
  <p class="text-sm mb-5" style="color:var(--ink-dim)">Gestiona tus próximas acciones comerciales.</p>
  ${tabla(atrasados,'Atrasados','#e0603e')}
  ${tabla(hoyList,'Hoy','#e0a53e')}
  ${tabla(proximos,'Próximos')}
  `;
}

/* ===================== COMISIONES ===================== */
function viewComisiones(){
  const cs = misClientes();
  const rows = S.comisiones.filter(k=>cs.some(c=>c.id===k.clienteId)).map(k=>{
    const c = S.clientes.find(x=>x.id===k.clienteId);
    return {...k, cliente:c};
  }).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  const totalVentas = rows.reduce((a,r)=>a+Number(r.valorTotal||0),0);
  return `
  <h2 class="text-xl font-bold mb-1">Comisiones</h2>
  <p class="text-sm mb-5" style="color:var(--ink-dim)">Ventas registradas y comisión comercial (4% sobre valor vendido).</p>
  <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-5">
    <div class="panel p-4"><div class="kicker">Ventas totales</div><div class="stat-num">${money(totalVentas)}</div></div>
    <div class="panel p-4"><div class="kicker">Comisión total (4%)</div><div class="stat-num" style="color:var(--accent)">${money(totalVentas*PCT)}</div></div>
    <div class="panel p-4"><div class="kicker">Registros</div><div class="stat-num">${numf(rows.length)}</div></div>
  </div>
  <div class="panel p-4"><div class="overflow-x-auto"><table>
    <thead><tr><th>Fecha</th><th>Cliente</th>${isAdmin()?'<th>Comercial</th>':''}<th>Evento</th><th>Entradas</th><th>Valor vendido</th><th>Comisión 4%</th></tr></thead>
    <tbody>${rows.length? rows.map(r=>`<tr>
      <td>${fdate(r.fecha)}</td><td class="font-semibold">${esc(r.cliente?.nombreEmpresa||'-')}</td>
      ${isAdmin()?`<td style="color:var(--ink-dim)">${nombreComercial(r.cliente?.comercialId)}</td>`:''}
      <td>${esc(r.evento)}</td><td>${numf(r.entradas)}</td><td>${money(r.valorTotal)}</td><td>${money(r.valorTotal*PCT)}</td></tr>`).join('') : `<tr><td colspan="7" style="color:var(--ink-dim)">Sin ventas registradas todavía.</td></tr>`}</tbody>
  </table></div></div>`;
}

/* ===================== COMERCIALES (admin) ===================== */
function viewComerciales(){
  return `
  <div class="flex items-center justify-between mb-5">
    <div><h2 class="text-xl font-bold">Comerciales</h2><p class="text-sm" style="color:var(--ink-dim)">${S.comerciales.length} en el equipo</p></div>
    <button class="btn btn-accent" onclick="openComercialForm()">+ Nuevo comercial</button>
  </div>
  <div class="panel p-4"><div class="overflow-x-auto"><table>
    <thead><tr><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Alta</th><th>Estado</th><th>Clientes</th><th></th></tr></thead>
    <tbody>${S.comerciales.length? S.comerciales.map(cm=>{
      const n = S.clientes.filter(c=>c.comercialId===cm.id).length;
      return `<tr>
        <td class="font-semibold">${esc(cm.nombre)}</td><td>${esc(cm.email)}</td><td>${esc(cm.telefono||'-')}</td>
        <td>${fdate(cm.fechaIncorporacion)}</td>
        <td><span class="badge" style="background:${cm.estado==='activo'?'#26332c':'#332626'};color:${cm.estado==='activo'?'#3ecf8e':'#e0603e'}">${cm.estado}</span></td>
        <td>${n}</td>

      </tr>`;
    }).join('') : `<tr><td colspan="7" style="color:var(--ink-dim)">Sin comerciales todavía.</td></tr>`}</tbody>
  </table></div></div>`;
}
window.openComercialForm = function(id){ S.ui.showComercialForm = id || 'new'; render(); }
window.closeComercialForm = function(){ S.ui.showComercialForm = null; render(); }
function modalComercialForm(){
  const editing = S.ui.showComercialForm!=='new';
  const cm = editing ? S.comerciales.find(x=>x.id===S.ui.showComercialForm) : {};
  return `
  <div class="modal-bg" onclick="if(event.target===this) closeComercialForm()">
    <div class="panel p-6 w-full max-w-md mt-4">
      <div class="flex justify-between items-center mb-4"><div class="font-bold text-lg">${editing?'Editar comercial':'Nuevo comercial'}</div><button class="btn btn-ghost text-xs" onclick="closeComercialForm()">Cerrar</button></div>
      <div class="space-y-3">
        <div><label>Nombre</label><input id="cm_nombre" value="${esc(cm.nombre)}"></div>
        <div><label>Email</label><input id="cm_email" type="email" value="${esc(cm.email)}"></div>
        <div><label>Teléfono</label><input id="cm_telefono" value="${esc(cm.telefono)}"></div>
        <div><label>Fecha de incorporación</label><input id="cm_fecha" type="date" value="${cm.fechaIncorporacion||todayISO()}"></div>
        <div><label>Estado</label><select id="cm_estado"><option value="activo" ${cm.estado==='activo'?'selected':''}>Activo</option><option value="inactivo" ${cm.estado==='inactivo'?'selected':''}>Inactivo</option></select></div>
        ${!editing?`<div class="pt-2 border-t" style="border-color:var(--line)"><div class="kicker mb-2">Acceso al CRM</div><label>Contraseña de acceso</label><input id="cm_pass" type="password"></div>`:''}
      </div>
      <button class="btn btn-accent w-full mt-5" onclick="saveComercial(${editing?`'${cm.id}'`:'null'})">Guardar</button>
    </div>
  </div>`;
}
window.saveComercial = async function(id){
  const g = k=>document.getElementById('cm_'+k).value;
  const data = {nombre:g('nombre').trim(), email:g('email').trim().toLowerCase(), telefono:g('telefono').trim(), fechaIncorporacion:g('fecha'), estado:g('estado')};
  if(!data.nombre||!data.email){ alert('Nombre y email son obligatorios.'); return; }
  if(id){ await S.fb.updateDoc(S.fb.doc(col('crm2_comerciales'), id), data); }
  else{
    const ref = await S.fb.addDoc(col('crm2_comerciales'), data);
    const pass = g('pass') || Math.random().toString(36).slice(2,8);
    await S.fb.setDoc(S.fb.doc(col('crm2_users'), uid()), {nombre:data.nombre, email:data.email, pass, role:'comercial', comercialId:ref.id, creado:todayISO()});
  }
  S.ui.showComercialForm=null; render();
}

/* ===================== IMPORTAR / EXPORTAR ===================== */
function viewImportar(){
  return `
  <h2 class="text-xl font-bold mb-1">Importar / Exportar</h2>
  <p class="text-sm mb-5" style="color:var(--ink-dim)">Importa tu base de contactos desde CSV o exporta la cartera actual.</p>
  <div class="grid md:grid-cols-2 gap-4">
    <div class="panel p-5">
      <div class="font-bold mb-2">Importar CSV</div>
      <p class="text-xs mb-3" style="color:var(--ink-dim)">Columnas esperadas: Nombre, Empresa, Teléfono, Email, Ciudad, Provincia, Tipo de cliente. El sistema detecta duplicados por email o teléfono antes de importar.</p>
      <input type="file" id="csvFile" accept=".csv" class="mb-3">
      <button class="btn btn-accent" onclick="handleCsvFile()">Analizar archivo</button>
      <div id="importResult" class="mt-4"></div>
    </div>
    <div class="panel p-5">
      <div class="font-bold mb-2">Exportar clientes</div>
      ${isOwner()?`
      <p class="text-xs mb-3" style="color:var(--ink-dim)">Exporta la cartera visible actualmente (según tus filtros en la pestaña Clientes).</p>
      <button class="btn btn-ghost" onclick="exportCsv()">Descargar CSV</button>
      `:`
      <p class="text-xs" style="color:var(--ink-dim)">La descarga de la base de datos está restringida al administrador principal.</p>
      `}
    </div>
  </div>`;
}
window.handleCsvFile = function(){
  const file = document.getElementById('csvFile').files[0];
  if(!file){ alert('Selecciona un archivo CSV.'); return; }
  Papa.parse(file, {
    header:true, skipEmptyLines:true,
    complete: res => processImport(res.data)
  });
}
function normPhone(s){ return (s||'').replace(/\D/g,''); }
function processImport(rows){
  const existingEmails = new Set(S.clientes.map(c=>(c.email||'').toLowerCase()).filter(Boolean));
  const existingPhones = new Set(S.clientes.map(c=>normPhone(c.telefono)).filter(Boolean));
  const get = (r,...keys)=>{ for(const k of keys){ const found = Object.keys(r).find(kk=>kk.trim().toLowerCase()===k); if(found && r[found]) return r[found]; } return ''; };
  const mapped = rows.map(r=>({
    nombreEmpresa: get(r,'empresa','nombre de empresa','sala','compañía')||get(r,'nombre'),
    personaContacto: get(r,'nombre','persona de contacto','contacto'),
    telefono: get(r,'teléfono','telefono','tel','whatsapp'),
    email: get(r,'email','correo').toLowerCase(),
    ciudad: get(r,'ciudad'),
    provincia: get(r,'provincia'),
    tipoCliente: get(r,'tipo de cliente','tipo')||'Otro'
  })).filter(r=>r.nombreEmpresa);
  mapped.forEach(r=>{ r.dup = (r.email && existingEmails.has(r.email)) || (r.telefono && existingPhones.has(normPhone(r.telefono))); });
  S.ui.importRows = mapped;
  const dupes = mapped.filter(r=>r.dup).length;
  document.getElementById('importResult').innerHTML = `
    <div class="text-sm mb-2">${mapped.length} filas leídas · <span style="color:${dupes?'var(--warn)':'var(--accent)'}">${dupes} posibles duplicados detectados</span></div>
    <div class="max-h-64 overflow-y-auto panel2 p-2 mb-3 text-xs">
      ${mapped.slice(0,300).map(r=>`<div class="flex justify-between py-1 border-b" style="border-color:var(--line)"><span>${esc(r.nombreEmpresa)} ${r.dup?'<span class=\"badge\" style=\"background:#332626;color:#e0603e\">DUPLICADO</span>':''}</span><span style="color:var(--ink-dim)">${esc(r.email||r.telefono||'')}</span></div>`).join('')}
      ${mapped.length>300?`<div class="text-center pt-2" style="color:var(--ink-dim)">... y ${mapped.length-300} más</div>`:''}
    </div>
    <button class="btn btn-accent" onclick="confirmImport(false)">Importar ${mapped.length-dupes} nuevos (omitir duplicados)</button>
    <button class="btn btn-ghost ml-2" onclick="confirmImport(true)">Importar todos igualmente</button>
  `;
}
window.confirmImport = async function(includeDupes){
  const rows = includeDupes ? S.ui.importRows : S.ui.importRows.filter(r=>!r.dup);
  let batch = S.fb.writeBatch(S.db); let count=0; let total=0;
  for(const r of rows){
    const ref = S.fb.doc(col('crm2_clientes'));
    batch.set(ref, {
      nombreEmpresa:r.nombreEmpresa, personaContacto:r.personaContacto, telefono:r.telefono, email:r.email,
      ciudad:r.ciudad, provincia:r.provincia, tipoCliente:r.tipoCliente, estado:'Nuevo',
      comercialId: isAdmin()? null : S.session.comercialId, fechaAlta:todayISO(),
      eventosAnio:0, mediaEntradas:0, precioMedio:0
    });
    count++; total++;
    if(count===450){ await batch.commit(); batch = S.fb.writeBatch(S.db); count=0; }
  }
  if(count>0) await batch.commit();
  alert(`${total} clientes importados correctamente.`);
  document.getElementById('importResult').innerHTML='';
  S.ui.importRows=[];
}
window.exportCsv = function(){
  if(!isOwner()){ alert('No tienes permiso para descargar la base de datos.'); return; }
  const f = S.ui.clienteFiltro;
  let cs = misClientes().map(c=>({...c,...calcPotencial(c)}));
  if(f.q) cs = cs.filter(c=> [c.nombreEmpresa,c.personaContacto,c.telefono,c.email,c.ciudad].join(' ').toLowerCase().includes(f.q.toLowerCase()));
  if(f.comercial) cs = cs.filter(c=>c.comercialId===f.comercial);
  if(f.estado) cs = cs.filter(c=>c.estado===f.estado);
  if(f.tipo) cs = cs.filter(c=>c.tipoCliente===f.tipo);
  if(f.prioridad) cs = cs.filter(c=>c.prioridad===f.prioridad);
  const data = cs.map(c=>({
    Empresa:c.nombreEmpresa, Contacto:c.personaContacto, Telefono:c.telefono, Email:c.email, Ciudad:c.ciudad, Provincia:c.provincia,
    Tipo:c.tipoCliente, Estado:c.estado, Comercial:nombreComercial(c.comercialId),
    EventosAnio:c.eventosAnio, MediaEntradas:c.mediaEntradas, PrecioMedio:c.precioMedio,
    VentasAnuales:c.ventasAnuales, RetornoAnual:c.retornoAnual, Prioridad:c.prioridad
  }));
  const csv = Papa.unparse(data);
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'entradasya_clientes.csv'; a.click();
}

/* ===================== INICIO ===================== */
window.addEventListener('fb-ready', ()=>{ render(); });
</script>
